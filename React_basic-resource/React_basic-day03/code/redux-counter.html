<button id="decrement">-</button>
<span id="count">0</span>
<button id="increment">+</button>

<script src="https://unpkg.com/redux@4.2.1/dist/redux.min.js"></script>

<script>
  // 1. 定義reducer函式 
  // 作用: 根據不同的action物件，返回不同的新的state
  // state: 管理的資料初始狀態
  // action: 物件 type 標記目前想要做什麼樣的修改
  function reducer (state = { count: 0 }, action) {
    // 資料不可變：基於原始狀態產生一個新的狀態
    if (action.type === 'INCREMENT') {
      return { count: state.count + 1 }
    }
    if (action.type === 'DECREMENT') {
      return { count: state.count - 1 }
    }
    return state
  }

  // 2. 使用function reducer函式產生store實例
  const store = Redux.createStore(reducer)

  // 3. 透過store實例的subscribe訂閱資料變化
  // 回呼函式可以在每次state發生變化的時候自動執行
  store.subscribe(() => {
    console.log('state变化了', store.getState())
    document.getElementById('count').innerText = store.getState().count
  })

  // 4. 透過store實例的dispatch函式提交action更改狀態 

  //從 HTML 裡找到 id="increment" 的元素，然後把這個 DOM 元素存進 inBtn。
  const inBtn = document.getElementById('increment')
  inBtn.addEventListener('click', () => {
    // 增
    //當 inBtn 被點擊時，通知 Redux：「我要執行 INCREMENT」
    store.dispatch({
      type: 'INCREMENT'
    })
  })
  //從 HTML 裡找到 id="decrement" 的元素，然後把這個 DOM 元素存進 dBtn。
  const dBtn = document.getElementById('decrement')
  dBtn.addEventListener('click', () => {
    // 減
    //當 dBtn 被點擊時，通知 Redux：「我要執行 DECREMENT」
    store.dispatch({
      type: 'DECREMENT'
    })
  })

  // 5. 透過store實例的getState方法取得最新狀態更新到檢視中

</script>
