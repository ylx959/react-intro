<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Web site created using create-react-app"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json 提供網頁應用程式安裝到使用者手機或電腦時所需的中繼資料。
      參見 https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      注意上方標籤中使用的 %PUBLIC_URL%。
      建置時它會被替換成 `public` 資料夾的 URL。
      HTML 中只能引用 `public` 資料夾內的檔案。

      與 "/favicon.ico" 或 "favicon.ico" 不同，"%PUBLIC_URL%/favicon.ico"
      在客戶端路由和非根目錄的 public URL 下都能正常運作。
      執行 `npm run build` 可了解如何設定非根目錄的 public URL。
    -->
    <title>React App</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      這個 HTML 檔案是一個模板。
      如果直接在瀏覽器中開啟，會看到一個空白頁面。

      你可以在此檔案中加入網頁字型、meta 標籤或分析工具。
      建置步驟會把打包後的腳本放進 <body> 標籤中。

      開始開發請執行 `npm start` 或 `yarn start`。
      建立正式版打包請使用 `npm run build` 或 `yarn build`。
    -->
  </body>
</html>
